try { applyTheme(JSON.parse(localStorage.getItem('hub:prefs') || 'null')); } catch (e) { applyTheme(null); }

<style>
:root {
  --ha: 275; --ca: .2; --hb: 55; --cb: .03; --uc: .1;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --body: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --bg: oklch(96.5% var(--cb) var(--hb)); --surface: oklch(99.4% calc(var(--cb) * .35) var(--hb)); --sunk: oklch(93% calc(var(--cb) * 1.1) var(--hb));
  --ink: oklch(21% .025 var(--ha)); --ink-2: oklch(40% .025 var(--ha)); --ink-3: oklch(52% .02 var(--ha));
  --line: oklch(89% .02 var(--hb)); --line-2: oklch(79% .025 var(--hb));
  --acc: oklch(48% var(--ca) var(--ha)); --acc-hover: oklch(41% var(--ca) var(--ha)); --on-acc: #fff; --acc-soft: oklch(94% .045 var(--ha)); --acc-ink: oklch(44% var(--ca) var(--ha));
  --u-tint-l: 88%; --u-deep-l: 34%; --u-ink-l: 24%;
  --good: oklch(50% .13 150); --good-soft: oklch(94% .05 150); --bad: oklch(52% .19 27); --bad-soft: oklch(94% .04 27); --shaky: oklch(60% .15 62); --shaky-soft: oklch(95% .05 75);
  --untried: oklch(84% .01 var(--hb));
  --r: 14px; --r-sm: 9px; --shadow: 0 1px 2px oklch(20% .03 var(--hb) / .06), 0 8px 24px -12px oklch(20% .05 var(--hb) / .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(16.5% calc(var(--cb) * .9) var(--hb)); --surface: oklch(20.5% calc(var(--cb) * .9) var(--hb)); --sunk: oklch(14% calc(var(--cb) * .8) var(--hb));
  --ink: oklch(95% .01 var(--ha)); --ink-2: oklch(79% .02 var(--ha)); --ink-3: oklch(67% .02 var(--ha));
  --line: oklch(29% .02 var(--hb)); --line-2: oklch(39% .025 var(--hb));
  --acc: oklch(76% calc(var(--ca) * .75) var(--ha)); --acc-hover: oklch(83% calc(var(--ca) * .6) var(--ha)); --on-acc: oklch(18% .04 var(--ha)); --acc-soft: oklch(29% .07 var(--ha)); --acc-ink: oklch(80% calc(var(--ca) * .7) var(--ha));
  --u-tint-l: 33%; --u-deep-l: 85%; --u-ink-l: 94%;
  --good: oklch(77% .14 150); --good-soft: oklch(27% .05 150); --bad: oklch(72% .15 25); --bad-soft: oklch(28% .06 27); --shaky: oklch(80% .13 70); --shaky-soft: oklch(29% .05 70);
  --untried: oklch(36% .015 var(--hb));
  --shadow: 0 1px 2px #0004, 0 10px 28px -14px #000a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: oklch(16.5% calc(var(--cb) * .9) var(--hb)); --surface: oklch(20.5% calc(var(--cb) * .9) var(--hb)); --sunk: oklch(14% calc(var(--cb) * .8) var(--hb));
  --ink: oklch(95% .01 var(--ha)); --ink-2: oklch(79% .02 var(--ha)); --ink-3: oklch(67% .02 var(--ha));

  --acc: oklch(76% calc(var(--ca) * .75) var(--ha)); --acc-hover: oklch(83% calc(var(--ca) * .6) var(--ha)); --on-acc: oklch(18% .04 var(--ha)); --acc-soft: oklch(29% .07 var(--ha)); --acc-ink: oklch(80% calc(var(--ca) * .7) var(--ha));
  --u-tint-l: 33%; --u-deep-l: 85%; --u-ink-l: 94%;
  --good: oklch(77% .14 150); --good-soft: oklch(27% .05 150); --bad: oklch(72% .15 25); --bad-soft: oklch(28% .06 27); --shaky: oklch(80% .13 70); --shaky-soft: oklch(29% .05 70);
  --untried: oklch(36% .015 var(--hb));

/* a unit's own colour: any element with the .u class and --uh set */
.u { --u-tint: oklch(var(--u-tint-l) var(--uc) var(--uh)); --u-deep: oklch(var(--u-deep-l) calc(var(--uc) * 1.3) var(--uh)); --u-ink: oklch(var(--u-ink-l) .03 var(--uh)); --u-dot: oklch(64% .16 var(--uh)); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; accent-color: var(--acc); }
::selection { background: var(--acc-soft); color: var(--ink); }
a { color: var(--acc-ink); text-underline-offset: .2em; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
[data-preset="matcha"] h1, [data-preset="matcha"] h2 { font-weight: 400; letter-spacing: 0; }
[data-preset="lagoon"] h1 { letter-spacing: -.03em; }
.n { font-variant-numeric: tabular-nums; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-2); }
.empty { color: var(--ink-2); margin: 0; }

/* ---- app bar ---- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 1.125rem; letter-spacing: -.01em; }
.logo { width: 30px; height: 30px; flex: none; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .9375rem; padding: 6px 12px 6px 6px; border-radius: 999px; }
.crumb:hover { background: var(--sunk); color: var(--ink); }
.top .sp { flex: 1; }
.pal-btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 600; font-size: .875rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; box-shadow: var(--shadow); min-height: 36px; }
.pal-btn:hover { border-color: var(--line-2); }
.pal-btn .dots { display: inline-flex; }
.pal-btn .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -5px; }
.pal-btn .dots i:first-child { margin-left: 0; }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; font: inherit; font-weight: 700; font-size: .9375rem;
  text-decoration: none; cursor: pointer; border: 1.5px solid var(--acc); background: var(--acc); color: var(--on-acc); transition: background-color .15s ease-out, border-color .15s ease-out, transform .15s ease-out; }
.btn:hover { background: var(--acc-hover); border-color: var(--acc-hover); color: var(--on-acc); }
.btn:active { transform: translateY(1px); }
.btn.out { background: var(--surface); color: var(--acc-ink); border-color: var(--line-2); }
.btn.out:hover { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-ink); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .875rem; }
.btn:disabled { background: transparent; color: var(--ink-3); border-color: var(--line); cursor: default; transform: none; }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--acc); color: var(--on-acc); font-size: .75rem; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---- home ---- */
.home { display: flex; flex-direction: column; gap: 36px; padding-top: 18px; padding-bottom: 64px; }
.hello .eyebrow { margin: 0 0 6px; color: var(--ink-3); font-weight: 700; font-size: .8125rem; letter-spacing: .06em; text-transform: uppercase; }
.hello h1 { font-size: clamp(2.25rem, 6vw, 3.5rem); }
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; padding: 28px; border-radius: 26px; background: var(--u-tint); color: var(--u-ink); }
.hero::before { content: ""; position: absolute; width: 340px; height: 340px; right: -90px; top: -150px; border-radius: 50%; background: var(--u-dot); opacity: .2; pointer-events: none; }
.hero::after { content: ""; position: absolute; width: 180px; height: 180px; right: 140px; bottom: -120px; border-radius: 42% 58% 50% 50%; background: var(--acc); opacity: .16; pointer-events: none; }
.hero > * { position: relative; }
.hero .k { font-weight: 800; font-size: .8125rem; letter-spacing: .07em; text-transform: uppercase; color: var(--u-deep); margin: 0; }
.hero .big { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; flex-wrap: wrap; }
.hero .big b { font-family: var(--display); font-size: clamp(4rem, 12vw, 6.5rem); line-height: .9; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
[data-preset="matcha"] .hero .big b { font-weight: 400; letter-spacing: -.02em; }
.hero .big span { font-family: var(--display); font-size: 1.375rem; font-weight: 600; }
.hero .when { margin: 0; font-weight: 500; }
.hero .side { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.cont { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); color: var(--ink); text-decoration: none; box-shadow: var(--shadow); }
.cont:hover { box-shadow: 0 0 0 2px var(--acc), var(--shadow); }
.cont small { display: block; color: var(--ink-3); font-weight: 700; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
.cont b { display: block; font-weight: 700; line-height: 1.3; }
.cont .ic { margin-left: auto; color: var(--acc-ink); }
.ring { flex: none; width: 42px; height: 42px; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bgc { stroke: var(--sunk); } .ring .fg { stroke: var(--acc); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { font-size: 1.5rem; }
.sec-h .muted { font-size: .9375rem; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 16px; }
.ucard { display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: var(--surface); color: var(--ink); text-decoration: none; box-shadow: var(--shadow);
  border: 1px solid var(--line); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease-out; }
.ucard:hover { transform: translateY(-3px); color: var(--ink); }
.ucard .face { position: relative; overflow: hidden; background: var(--u-tint); color: var(--u-ink); padding: 18px 20px 20px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.ucard .face::after { content: ""; position: absolute; right: -36px; bottom: -56px; width: 150px; height: 150px; border-radius: 50%; border: 22px solid var(--u-dot); opacity: .28; }
.ucard .code { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; letter-spacing: -.02em; position: relative; z-index: 1; }
[data-preset="matcha"] .ucard .code { font-weight: 400; font-size: 2.375rem; }
.ucard .name { font-weight: 700; margin-top: 6px; position: relative; z-index: 1; line-height: 1.3; }
.chip { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 3px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 700; background: var(--surface); color: var(--ink); position: relative; z-index: 1; }
.chip .ic { width: 14px; height: 14px; }
.ucard .info { padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.ucard .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-2); font-size: .875rem; }
.ucard .meta b { color: var(--ink); }

/* concept heat strip: one tick per concept */
.heat { display: flex; gap: 3px; height: 10px; min-width: 0; }
.heat i { flex: 1; min-width: 3px; max-width: 26px; border-radius: 3px; background: var(--untried); }

/* ---- unit page ---- */
.uhead { position: relative; overflow: hidden; background: var(--u-tint); color: var(--u-ink); border-radius: 26px; padding: 26px 28px 0; margin-top: 8px; }
.uhead::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; border: 34px solid var(--u-dot); opacity: .22; pointer-events: none; }
.uhead > * { position: relative; z-index: 1; }
.uhead .code { margin: 0; font-weight: 800; font-size: .8125rem; letter-spacing: .08em; color: var(--u-deep); }
.uhead h1 { font-size: clamp(1.875rem, 5vw, 2.75rem); margin-top: 4px; }
.uhead .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; }
.uhead .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.cd { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; }
.cd b { font-family: var(--display); font-size: 2.5rem; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
[data-preset="matcha"] .cd b { font-weight: 400; }
.cd span { font-weight: 700; }
.cd small { width: 100%; font-size: .875rem; margin-top: 4px; }
.tabs { display: flex; gap: 8px; margin-top: 22px; }
.tabs a { flex: 0 1 200px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--u-ink); text-decoration: none; font-weight: 700; padding: 12px 16px 14px;
  border-radius: 16px 16px 0 0; background: color-mix(in oklab, var(--bg) 40%, transparent); box-shadow: inset 0 1px 0 color-mix(in oklab, var(--bg) 70%, transparent); transition: background .15s ease-out; }
.tabs a .ic { width: 18px; height: 18px; }
.tabs a .ct { font-size: .75rem; font-weight: 800; min-width: 22px; padding: 1px 7px; border-radius: 999px; text-align: center; background: color-mix(in oklab, var(--u-dot) 55%, transparent); font-variant-numeric: tabular-nums; }
.tabs a:hover { background: color-mix(in oklab, var(--bg) 70%, transparent); }
.tabs a[aria-current="page"] { background: var(--bg); color: var(--ink); box-shadow: none; }
.tabs a[aria-current="page"] .ct { background: var(--acc); color: var(--on-acc); }
.upage { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; padding-bottom: 64px; }

/* quiz list */
.list { display: flex; flex-direction: column; gap: 12px; }
.qrow { display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.qrow h3 { font-size: 1.125rem; }
.qrow .meta { color: var(--ink-2); font-size: .875rem; margin-top: 3px; }
.qrow .cells { grid-column: 1 / -1; }

/* question cells + marks */
.cells { display: flex; flex-wrap: wrap; gap: 4px; }
.cell { width: 22px; height: 22px; border: 1px solid var(--line-2); border-radius: 6px; display: grid; place-items: center; background: var(--surface); color: var(--ink-3); padding: 0; }
.cell .mk { width: 16px; height: 16px; }
.cells.big { gap: 6px; }
.cells.big .cell { width: 34px; height: 34px; border-radius: 10px; font: 700 .75rem var(--body); font-variant-numeric: tabular-nums; cursor: pointer; position: relative; }
.cells.big .cell:hover { border-color: var(--acc); }
.cells.big .cell .mk { position: absolute; inset: 4px; width: auto; height: auto; }
.cells.big .cell.has span { visibility: hidden; }
.cells.big .cell.cur { border: 2px solid var(--acc); color: var(--acc-ink); box-shadow: 0 0 0 3px var(--acc-soft); }
.mk { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mk.ok { stroke: var(--good); } .mk.gs { stroke: var(--shaky); } .mk.no { stroke: var(--bad); } .mk.sk { stroke: var(--ink-3); stroke-width: 2.2; }
@media (prefers-reduced-motion: no-preference) {
  .mk.draw path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: ink .32s cubic-bezier(.2,.8,.2,1) forwards; }
  .mk.draw path + path { animation-delay: .12s; }
  @keyframes ink { to { stroke-dashoffset: 0; } }
  .wk[open] .wk-b { animation: fold .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes fold { from { opacity: 0; transform: translateY(-6px); } }
}

/* progress: weeks fold shut; open one to see its concepts */
.pv-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.pv-sum p { margin: 0; font-weight: 600; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .8125rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.weeks { display: flex; flex-direction: column; gap: 10px; }
.wk { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.wk summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto 20px; align-items: center; gap: 16px; padding: 16px 18px; }
.wk summary::-webkit-details-marker { display: none; }
.wk summary:hover { background: var(--sunk); }
.wk .wn { font-family: var(--display); font-weight: 800; font-size: 1.125rem; min-width: 5em; line-height: 1.2; }
[data-preset="matcha"] .wk .wn { font-weight: 400; font-size: 1.3rem; }
.wk .wn small { display: block; font-family: var(--body); font-weight: 600; font-size: .8125rem; color: var(--ink-3); letter-spacing: 0; }
.wk .avg { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; min-width: 3.5em; }
.wk .avg.none { color: var(--ink-3); font-weight: 600; font-size: .875rem; }

<script>
// ---------- store ----------
// Backend: claude db when available, else localStorage ("hub:" prefix). All collections load once into memory; writes go through.
window.HUB_SEED = window.HUB_SEED || null; // tests may set this before the script runs
const SEED = {};
const CONTENT = ['concepts', 'questions', 'quizzes', 'meta', 'exams', 'notes'];
const USER = ['attempts', 'srs', 'flags', 'progress', 'prefs', 'sittings', 'requests', 'reports'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const noteFail = () => { const n = $('#note'); if (n) n.hidden = false; };

const Store = {
  db: null, data: {}, chain: {},
  async init() {
    let db = null;
    try { if (window.claude && claude.use) db = await claude.use('db'); } catch (e) { db = null; }
    this.db = db;
    const seed = Object.assign({}, SEED, window.HUB_SEED || {});
    for (const c of CONTENT.concat(USER)) {
      this.data[c] = {};

  const Qs = Store.all('questions'), att = Object.entries(Store.all('attempts')).map(([id, a]) => Object.assign({ id }, a)).sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : 0);

function weakScore(q, S, srs, t) {

}

  const top = shuffle(qs).map(q => [q, weakScore(q, S, srs, t)]).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);

}

function flagBox(q) {

function answer(v) {
  const q = run.Q[run.i], ok = q.o ? v === q.a : Math.abs(v - q.num) <= q.tol;
  const prev = Store.get('srs/' + q.id);
  const att = Store.add('attempts', { qid: q.id, quiz: run.quiz, ok, pick: v, sure: null, at: new Date().toISOString() });
  run.res[q.id] = { ok, pick: v, sure: null, att, prev: prev ? Object.assign({}, prev) : null, fresh: true };
  run.skipped.delete(q.id);
  srsApply(q.id, ok, true, prev);
  drawMark = true;
  persist(); showQuiz(); $('#next').focus();
}

function feedback() {

function summary() {
  const c = $('#card'), n = run.qids.length, right = run.qids.filter(id => run.res[id] && run.res[id].ok).length;

  const open = run.Q.map((q, k) => [q, k]).filter(([q]) => !run.res[q.id]);
  const item = ([q, k]) => `<li><a href="#" class="jump" data-k="${k}">Q${k + 1}</a> <span class="muted">${esc(q.w)}</span><div>${q.q}</div>${links(q, true, false)}</li>`;
  const S = stats(), seen = new Set(); run.Q.forEach(q => (q.concepts || []).forEach(x => seen.add(x)));
  const weak = [...seen].filter(x => S.con[x] && S.con[x].m < 0.8).sort((a, b) => S.con[a].m - S.con[b].m).slice(0, 3).map(x => esc((Store.all('concepts')[x] || {}).name || x));
  c.innerHTML = `<div class="head"><span class="qn">Results</span></div><div class="body">
    <div class="result"><span class="big">${right} / ${n}</span><span class="muted">right</span></div>

  c.querySelectorAll('.jump').forEach(a => a.onclick = e => { e.preventDefault(); go(+a.dataset.k); });
  $('#back').onclick = () => go(open.length ? open[0][1] : n - 1);
  typeset(c); strip(); drawMark = false;
}

// Generated sessions (weak spots, due reviews) can be narrowed to one unit. Replaces the earlier buildRun.
function buildRun(route) {
  const Qs = Store.all('questions'), inUnit = q => isAuto(q) && (!route.unit || unitKey(q.unit) === route.unit); let r;
  if (route.kind === 'quiz') {
    const z = Store.all('quizzes')[route.id]; if (!z) return null;
    const pr = Store.get('progress/' + route.id) || {}, lat = latestIn(route.id), res = {};
    Object.entries(lat).forEach(([q, a]) => res[q] = toRes(a));
    const open = z.qids.findIndex(q => !res[q]);
    r = { key: route.id, quiz: route.id, unit: unitKey(z.unit), title: z.title, qids: z.qids.filter(q => Qs[q]), i: pr.i != null ? pr.i : Math.max(open, 0), skipped: new Set((pr.skipped || []).filter(q => !res[q])), res, persistent: true };
  } else {
    const sk = 'hub:sess:' + route.key, saved = ssGet(sk); let st = null;
    try { st = saved && JSON.parse(saved); } catch (e) {}
    const con = route.kind === 'concept' ? Store.all('concepts')[route.id] || {} : null;
    const title = route.kind === 'weak' ? 'Revise weak spots' : route.kind === 'due' ? 'Due reviews' : 'Practice: ' + (con.name || 'concept');
    if (!st) {
      const qids = route.kind === 'weak' ? weakIds(10, inUnit)
        : route.kind === 'due' ? dueIds().filter(id => Qs[id] && inUnit(Qs[id]))
        : weakIds(10, q => isAuto(q) && (q.concepts || []).includes(route.id));
      st = { qids, i: 0, skipped: [], res: {} };
    }
    const quiz = route.kind === 'concept' ? 'concept:' + route.id : route.kind + (route.unit ? ':' + route.unit : '');
    r = { key: route.key, quiz, unit: route.unit || (con ? unitKey(con.unit) : ''), title, qids: st.qids.filter(q => Qs[q]), i: st.i, skipped: new Set(st.skipped), res: st.res, persistent: false, sk };
  }
  r.Q = r.qids.map(id => Object.assign({ id }, Qs[id]));
  return r;
}

// ---------- practice exams ----------
// exams/<id>: {unit, title, created, minutes, qids[], marks?: {qid: n}, intro?}
// sittings/<id>: {exam, unit, started, timed, minutes, ends, ans: {qid: pick}, rev: [qid], i, done, finished, self: {qid: 0|.5|1}, selfAtt: {qid: attemptId}}

const isAuto = q => !!q && (!!q.o || q.num != null);
const isRight = (q, a) => q.o ? +a === q.a : Math.abs(parseFloat(a) - q.num) <= q.tol;
const hasAns = a => a != null && String(a).trim() !== '';
const exMarks = (z, qid) => (z.marks && z.marks[qid]) || 1;
const exTotal = z => z.qids.reduce((s, q) => s + exMarks(z, q), 0);
const examsOf = key => Object.entries(Store.all('exams')).filter(([, z]) => unitKey(z.unit) === key).sort((a, b) => a[1].created < b[1].created ? 1 : -1);
const sitsOf = id => Object.entries(Store.all('sittings')).filter(([, s]) => s && s.exam === id).sort((a, b) => a[1].started < b[1].started ? 1 : -1);
function exScore(z, s) {
  const Qs = Store.all('questions'); let got = 0, pending = 0;
  z.qids.forEach(id => { const q = Qs[id], m = exMarks(z, id), a = (s.ans || {})[id]; if (!q) return;
    if (isAuto(q)) { if (hasAns(a) && isRight(q, a)) got += m; }
    else { const v = (s.self || {})[id]; if (v != null) got += m * v; else pending++; } });
  return { got, total: exTotal(z), pending };
}
const fmtDur = ms => { const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const mins = ms => { const m = Math.round(ms / 6e4); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const shortDate = iso => new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Melbourne', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));

let ex = null, exTick = null, exPend = null;

function examShell(z, back, sub) {

function showExam(id, sid) {

    <dl class="facts"><div><dt>Questions</dt><dd>${Q.length}</dd></div><div><dt>Marks</dt><dd>${exTotal(z)}</dd></div><div><dt>Suggested time</dt><dd>${M} min</dd></div></dl>

function exRun(id, z, Q, sid, back) {

function exGo(k) { if (exPend) { exPend(); exPend = null; } exSave({ i: Math.max(0, Math.min(k, ex.Q.length - 1)) }); exStrip(); exCard(); window.scrollTo({ top: 0 }); }

    <span>${hasAns(a) && q.o ? '<button class="btn out" id="clr">Clear</button>' : ''}${last ? `<button class="btn" id="fin2">Finish exam${icon('right')}</button>` : `<button class="btn" id="next">Next${icon('right')}</button>`}</span></div></div>`;

function exReview(id, z, Q, sid, back) {

  const S = stats(), seen = new Set(); Q.forEach(q => { const a = s.ans[q.id]; if (isAuto(q) && !(hasAns(a) && isRight(q, a))) (q.concepts || []).forEach(x => seen.add(x)); });

  const setSelf = (qid, v) => {
    const cur = Store.get('sittings/' + sid), self = Object.assign({}, cur.self, { [qid]: v }), sa = Object.assign({}, cur.selfAtt);

function parse() {
  const h = decodeURIComponent((location.hash || '#/').slice(1)), p = h.split('/').filter(Boolean);
  if (p[0] === 'quiz' && p[1]) return { kind: 'quiz', id: p.slice(1).join('/'), key: 'quiz/' + p.slice(1).join('/') };
  if (p[0] === 's' && (p[1] === 'weak' || p[1] === 'due')) return { kind: p[1], unit: p[2] ? unitKey(p[2]) : '', key: p[1] + (p[2] ? '/' + unitKey(p[2]) : '') };
  if (p[0] === 's' && p[1] === 'concept' && p[2]) return { kind: 'concept', id: p.slice(2).join('/'), key: 'concept/' + p.slice(2).join('/') };
  if (p[0] === 'u' && p[1]) return { kind: 'unit', id: unitKey(p[1]), tab: p[2] === 'progress' || p[2] === 'exams' ? p[2] : 'quizzes' };
  if (p[0] === 'exam' && p[1]) return { kind: 'exam', id: p[1], sid: p[2] === 'r' ? p[3] : null };
  if (p[0] === 'progress') return { kind: 'progress' };
  return { kind: 'home' };
}
function render() {
  const r = parse(); window.scrollTo(0, 0); flagOpen = false; drawMark = false; palClose(false); exStop(); ex = null;
  if (r.kind === 'progress') { // old link: send it to the first unit that has concepts
    const S = stats(), u = unitList().find(x => unitStats(x.key, S).cs.length);
    location.replace(u ? '#/u/' + encodeURIComponent(u.key) + '/progress' : '#/'); return;
  }
  if (r.kind === 'home') { run = null; showHome(); }
  else if (r.kind === 'unit') { run = null; showUnit(r.id, r.tab); }
  else if (r.kind === 'exam') { run = null; showExam(r.id, r.sid); return; }
  else {
    run = buildRun(r);
    if (!run) { app().innerHTML = topbar({ href: '#/', label: 'Home' }) + `<main class="wrap upage"><p class="empty">That quiz isn't here any more.</p></main>`; return; }
    quizShell(); if (!run.persistent) persist(); showQuiz(); return;
  }
  typeset(app());
}

}
function drawAsk(w, q, ctx) {
  const st = ASK[q.id] = ASK[q.id] || { turns: [], open: false }, wrong = ctx.ok === false;
  if (!st.open) { w.innerHTML = `<button class="btn out sm askb">${icon('spark')}Ask Claude about this</button>`; w.querySelector('.askb').onclick = () => { st.open = true; drawAsk(w, q, ctx); w.querySelector('input') && w.querySelector('input').focus(); }; return; }
  const chips = [wrong ? 'Why is my answer wrong?' : 'Why is this the answer?', 'Explain it more simply', 'Give me a similar one to try'];
  w.innerHTML = `<div class="ask">${st.turns.map(t => `<div class="msg ${t.role === 'user' ? 'me' : 'cl'}">${t.role === 'user' ? esc(t.content) : md(t.content)}</div>`).join('')}
    ${st.busy ? `<div class="msg cl live"><span class="thinking">Thinking</span></div>` : ''}${st.err ? `<p class="aerr">${esc(st.err)}</p>` : ''}
    ${st.turns.length || st.busy ? '' : `<div class="chips">${chips.map(c => `<button class="chip2">${c}</button>`).join('')}</div>`}
    <form class="askf"><input placeholder="${st.turns.length ? 'Ask a follow-up' : 'Or type your own question'}" aria-label="Ask Claude" ${st.busy ? 'disabled' : ''}>${st.busy ? `<button type="button" class="btn out sm" id="astop">Stop</button>` : `<button class="btn sm">Ask</button>`}</form></div>`;
  w.querySelectorAll('.chip2').forEach(b => b.onclick = () => sendAsk(w, q, ctx, b.textContent));
  w.querySelector('.askf').onsubmit = e => { e.preventDefault(); const v = w.querySelector('input').value.trim(); if (v) sendAsk(w, q, ctx, v); };
  sendOnModEnter(w.querySelector('.askf input'), () => w.querySelector('.askf').requestSubmit());
  if (w.querySelector('#astop')) w.querySelector('#astop').onclick = () => st.ctl && st.ctl.abort();
  typeset(w);
}
async function sendAsk(w, q, ctx, text) {
  const st = ASK[q.id]; if (st.busy) return;
  const sample = SAMPLE === undefined ? await sampleReady : SAMPLE;
  if (!sample) { st.err = 'Claude isn’t switched on for this page.'; return drawAsk(w, q, ctx); }
  st.turns.push({ role: 'user', content: text }); st.busy = true; st.err = ''; drawAsk(w, q, ctx);
  const ctl = st.ctl = new AbortController(), turns = st.turns.slice(-12);
  try {
    const { text: out } = await sample([{ role: 'user', content: askCtx(q, ctx) }].concat(turns), { cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { const live = w.isConnected && w.querySelector('.live'); if (live) live.innerHTML = md(t); } });
    st.turns.push({ role: 'assistant', content: out });
  } catch (e) {
    if (e && e.text) st.turns.push({ role: 'assistant', content: e.text + (e.code === 'cancelled' ? '' : ' …') });
    else if (st.turns[st.turns.length - 1].role === 'user' && e && e.code === 'cancelled') st.turns.pop();
    st.err = sErr(e);
  }
  st.busy = false; st.ctl = null;
  const cur = document.querySelector(`[data-ask="${CSS.escape(q.id)}"]`); if (cur) drawAsk(cur, q, ctx);
}
function wireAsk(root, getCtx) {
  (root || document).querySelectorAll('[data-ask]').forEach(w => { const q = Object.assign({ id: w.dataset.ask }, Store.get('questions/' + w.dataset.ask)); if (q.q) drawAsk(w, q, getCtx(q)); });
}
sampleReady.then(s => { if (s === null) document.querySelectorAll('[data-ask]').forEach(w => w.remove()); });

// ---------- report a problem ----------
// Reports go to the `reports` collection. Claude files queued ones as GitHub issues on the ma-study repo.
const BUILD = 'hub-v14';
const RECENT_ERR = [];
const noteErr = m => { RECENT_ERR.push({ m: String(m).slice(0, 300), at: new Date().toISOString() }); if (RECENT_ERR.length > 5) RECENT_ERR.shift(); };
window.addEventListener('error', e => noteErr((e.message || 'error') + (e.filename ? ` @${e.filename.split('/').pop()}:${e.lineno}` : '')));
window.addEventListener('unhandledrejection', e => noteErr('rejection: ' + ((e.reason && (e.reason.message || e.reason.code)) || e.reason)));
let repKind = 'bug';
function repOpen() {
  let d = $('#rdlg');
  if (!d) { d = document.createElement('dialog'); d.className = 'dlg'; d.id = 'rdlg'; d.setAttribute('aria-labelledby', 'rdlg-t'); document.body.appendChild(d); }
  repDraw(d, ''); d.showModal(); $('#rtx').focus();
}
function repDraw(d, sent) {
  const mine = Object.entries(Store.all('reports')).sort((a, b) => (b[1].at || '').localeCompare(a[1].at || '')).slice(0, 5);
  const list = mine.length ? `<ul class="rep-list">${mine.map(([, r]) => `<li><span class="t">${esc(r.text)}</span><span class="s">${r.issue ? `<a href="${esc(r.issue)}" target="_blank" rel="noopener">Issue #${esc(r.issue.split('/').pop())}</a>` : r.status === 'filed' ? 'Filed' : r.status === 'declined' ? 'Not posted' : r.status === 'held' ? 'Held' : 'Waiting for your OK'}</span></li>`).join('')}</ul>` : '';
  d.innerHTML = `<h2 id="rdlg-t">Report a problem</h2>${sent ? `<p class="muted" style="margin:0 0 8px">${sent}</p>` : ''}
    <span class="seg rep-kind" role="group" aria-label="Kind of report">${[['bug', 'Something’s wrong'], ['idea', 'Idea']].map(([v, l]) => `<button data-k="${v}" aria-pressed="${repKind === v}">${l}</button>`).join('')}</span>
    <div class="flagbox"><label for="rtx">${repKind === 'bug' ? 'What went wrong?' : 'What would make the hub better?'}</label><textarea id="rtx" maxlength="4000" placeholder="${repKind === 'bug' ? 'What you did, what happened, what you expected' : 'Describe the idea'}"></textarea></div>
    <p class="muted rep-note">Claude will check with you in chat before posting this as an issue on the public ma-study GitHub repo. Leave out personal details.</p>
    <div class="qnav"><button class="btn out" id="rno">Close</button><button class="btn" id="rgo" aria-keyshortcuts="Control+Enter Meta+Enter">Send${sendHint()}</button></div>${list}`;
  sendOnModEnter($('#rtx'), () => $('#rgo').click());
  d.querySelectorAll('.rep-kind button').forEach(b => b.onclick = () => { const t = $('#rtx').value; repKind = b.dataset.k; repDraw(d, ''); $('#rtx').value = t; $('#rtx').focus(); });
  $('#rno').onclick = () => d.close();
  $('#rgo').onclick = () => {
    const text = $('#rtx').value.trim(); if (!text) { $('#rtx').focus(); return; }
    const q = typeof run !== 'undefined' && run && run.Q && run.Q[run.i];
    Store.add('reports', { kind: repKind, text, route: location.hash || '#/', qid: q ? q.id : null, build: BUILD, ua: navigator.userAgent.slice(0, 200), errors: RECENT_ERR.slice(), at: new Date().toISOString(), status: 'queued' });
    repDraw(d, 'Saved. Claude will ask you before posting it to GitHub.');
  };
}
document.addEventListener('click', e => { if (e.target.closest('#repb')) repOpen(); });
</script>
