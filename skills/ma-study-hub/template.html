/* quiz list */
.list { display: flex; flex-direction: column; gap: 12px; }

/* quiz and exam lists: tags, a ⋯ menu per row (shown on hover where there is hover), a list bar with the filter and the page ⋯ menu, and select mode */
.qrow:has(.qm) { grid-template-columns: minmax(0, 1fr) auto auto; }

/* Sort and Filter menus hang from the bar's left edge, so the second one still fits a phone screen. */

/* question cells + marks */

.cell .mk { width: 16px; height: 16px; }
.cells.big { gap: 6px; }

}

/* progress: weeks fold shut; open one to see its concepts */

.cfbtn .ic { width: 16px; height: 16px; }

.btn:not(.out) .badge { background: var(--on-acc); color: var(--acc-ink); }
.cmenu { position: absolute; z-index: 20; top: calc(100% + 6px); right: 0; width: max-content; min-width: 220px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; }

.copt { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 0 10px; min-height: 40px; border-radius: var(--r-sm); font-size: .875rem; font-weight: 600; cursor: pointer; }
.copt:hover { background: var(--acc-soft); }

/* Group names in a list menu: the .copt .n meta size and colour, bolder; no uppercase kicker. */
.lbar .cmenu h3 { font-family: var(--body); font-size: .8125rem; color: var(--ink-3); font-weight: 700; margin: 0; padding: 10px 10px 4px; }

.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-auto-flow: column; align-items: center; gap: 10px; padding: 12px 18px; transition: background-color .15s ease-out; position: relative; }

.tvid:hover, .tplay:hover { background: var(--sunk); color: var(--acc-ink); }

.vrow { padding-left: 56px; }

.trow.part .tbox .mk { display: none; }
.trow:hover { background: var(--acc-soft); }
.trow input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.trow .tbox { width: 24px; height: 24px; border: 1.5px solid var(--line-2); border-radius: 7px; display: grid; place-items: center; background: var(--surface); }
.trow .tbox .mk { width: 18px; height: 18px; visibility: hidden; }
.trow.done .tbox { border-color: var(--good); }

.trow input:focus-visible + .tbox { outline: 2px solid var(--acc); outline-offset: 2px; }
.trow .tt { font-weight: 600; }

.weeks { display: flex; flex-direction: column; gap: 10px; }

[data-preset="matcha"] .wk .wn { font-weight: 400; font-size: 1.3rem; }
.wk .wn small { display: block; font-family: var(--body); font-weight: 600; font-size: .8125rem; color: var(--ink-3); letter-spacing: 0; }

.wk .avg.none { color: var(--ink-3); font-weight: 600; font-size: .875rem; }
.wk .chev { transition: transform .2s ease-out; color: var(--ink-3); width: 20px; height: 20px; }
.wk[open] > summary .chev { transform: rotate(180deg); }
.wk[open] summary { border-bottom: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 3.2em; grid-template-areas: "name bar pct" "meta bar pct"; gap: 0 14px; align-items: center;
  padding: 12px 18px; text-decoration: none; color: var(--ink); transition: background-color .15s ease-out; }
.crow + .crow { border-top: 1px solid var(--line); }
.mwk .sum li { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.mwk .sum li:first-child { border-top: 0; }
.mwk .sum .taught { margin-top: 0; }
.mmeta { margin: 0; font-size: .8125rem; color: var(--ink-3); }
.mmeta .fixd { color: var(--good); font-weight: 700; }
.crow:hover { background: var(--acc-soft); color: var(--ink); }
.cname { grid-area: name; font-weight: 600; }
.crow small { grid-area: meta; color: var(--ink-3); font-size: .8125rem; }
.crow .track { grid-area: bar; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.crow .track i { display: block; height: 100%; border-radius: 4px; }

/* ---- quiz ---- */
.qhead { background: var(--u-tint); color: var(--u-ink); border-radius: 22px; padding: 18px 22px; display: flex; justify-content: space-between; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
.qhead h1 { font-size: 1.375rem; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.sheet .head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px dashed var(--line-2); min-height: 66px; }
.sheet .qn { font-family: var(--display); font-weight: 800; font-size: 1.375rem; }
[data-preset="matcha"] .sheet .qn { font-weight: 400; font-size: 1.6rem; }
.sheet .wkt { font-size: .8125rem; font-weight: 700; color: var(--ink-2); background: var(--sunk); padding: 3px 10px; border-radius: 999px; }
.sheet #mkw { margin-left: auto; display: flex; }
.sheet #mkw .mk { width: 34px; height: 34px; }
.body { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.q { font-size: 1.125rem; font-weight: 600; overflow-wrap: anywhere; }
.state { font-size: .875rem; color: var(--ink-2); margin-top: -8px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; overflow-wrap: anywhere; transition: border-color .15s ease-out, background-color .15s ease-out; }
.opt:hover:not(:disabled) { border-color: var(--acc); background: var(--acc-soft); }
.opt .k { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--sunk); font-weight: 800; font-size: .8125rem; color: var(--ink-2); }
.opt > span:not(.k) { flex: 1; min-width: 0; padding-top: 1px; }
.opt .mk { width: 22px; height: 22px; margin-left: auto; align-self: center; flex: none; }
.opt:disabled { cursor: default; color: var(--ink-2); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.opt.right .k { background: var(--good); color: var(--surface); } .opt.wrong .k { background: var(--bad); color: var(--surface); }
/* Why a picked wrong option is wrong: inside that option, to the right of its text (under it on narrow cards). */
.opt .owhy { flex: 1; min-width: 0; font-size: .875rem; color: var(--ink-2); border-left: 1px solid var(--line-2); padding-left: 12px; }
.opt .owhy b { color: var(--bad); font-weight: 700; }
@media (max-width: 699px) { .opt:has(.owhy) { flex-wrap: wrap; } .opt > span.owhy { order: 1; flex: 1 1 100%; border-left: 0; border-top: 1px dashed var(--line-2); padding: 8px 0 0; margin-left: 38px; } }
.numf { display: flex; gap: 8px; flex-wrap: wrap; }
.numf input { font: 600 1rem var(--body); padding: 0 14px; min-height: 44px; width: 11em; border: 1.5px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.numf input:disabled { color: var(--ink); background: var(--sunk); }
.numf input::placeholder { color: var(--ink-3); font-weight: 400; }
.fb { border-top: 1px dashed var(--line-2); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; overflow-wrap: anywhere; }
/* Formula panel (.cmenu.fsp): the question's formulas in quizzes, the whole sheet in practice exams. It grows to fit and the page scrolls; no scroll bar of its own.
   From 1100px it sits beside the paper: a page with a formula button (.qpage.fsroom) keeps a 376px column free on the right from the start, staying centred when the margin is already wide enough, so opening it moves nothing. Narrower, it opens in the flow below the button that opened it (quiz: under Back/Formulas/Flag; exam: under the question card, with the sticky exam bar keeping the button in reach), so the button and everything above it stay put. */
#card, .qpage { position: relative; }
#flagw:empty { display: none; }
.cmenu.fsp { position: static; z-index: auto; width: auto; min-width: 0; max-width: none; padding: 0; display: flex; flex-direction: column; border-color: var(--line-2); box-shadow: none; }
.cmenu.fsp[hidden] { display: none; }
.fsp .pal-h { padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.fsp .pal-h p { margin: 0; font-size: .875rem; font-weight: 600; color: var(--ink-2); }
.fsp-b { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 1100px) {
  .qpage.fsroom { --qw: min(792px, calc(100% - 392px)); width: var(--qw); max-width: none; margin-right: 0; margin-left: max(0px, min(calc((100% - var(--qw)) / 2), calc(100% - var(--qw) - 392px))); }
  .fsroom .cmenu.fsp { position: absolute; top: 0; left: calc(100% + 32px); width: 360px; box-shadow: var(--shadow); } .fsroom.qpage > .cmenu.fsp { left: calc(100% + 16px); } }
@media (prefers-reduced-motion: no-preference) { .fsp:not([hidden]) { animation: tpop .16s cubic-bezier(.2,.8,.2,1); } }
.fsr { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fsr > span { font-size: .875rem; color: var(--ink-2); }
.fsr mjx-container[display="true"] { margin: 4px 0 !important; text-align: left !important; }
/* MathJax 4 line-breaks wide maths. Only the 3.2.2 fallback (no line breaking) shrinks it to fit; never a scroll bar. */
mjx-container { max-width: 100%; } .mj3 mjx-container > svg { max-width: 100%; height: auto; }
.fsl { display: flex; flex-direction: column; gap: 10px; }
.fsl h3 { margin-top: 8px; font-size: 1rem; }
.fsl h3:first-child { margin-top: 0; }
/* exam sheet: the rest of the sheet in week folds, a flat .wk inside the panel */
.fsks { border-top: 1px solid var(--line); }
.wk.fsk { background: none; border: 0; border-radius: 0; box-shadow: none; overflow: visible; }

.wk.fsk[open] summary { border-bottom: 0; }
.wk.fsk > .fsp-b { padding-top: 0; }
/* Key terms: a dotted underline in running text; tap for the definition in a bubble (.cmenu.tpop) pointing at the word. */
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: help; text-decoration: underline dotted var(--ink-3); text-decoration-thickness: 1.5px; text-underline-offset: 3px; border-radius: 2px; }
.term:hover, .term[aria-expanded="true"] { text-decoration-color: var(--acc); text-decoration-style: solid; }
.cmenu.tpop { right: auto; border-color: var(--line-2); width: min(360px, calc(100vw - 32px)); min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; z-index: 40; }
.tpop::before { content: ""; position: absolute; left: var(--ax, 50%); top: -6px; width: 10px; height: 10px; margin-left: -6px; background: var(--surface); border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); transform: rotate(45deg); }
.tpop.up::before { top: auto; bottom: -6px; transform: rotate(225deg); }
.tpop > p { margin: 0; font-size: .875rem; font-weight: 600; color: var(--ink-2); }
.tpop .fsr > div { font-size: .875rem; }
.tpop .taught { font-size: .875rem; }
@media (prefers-reduced-motion: no-preference) { .tpop { animation: tpop .14s cubic-bezier(.2,.8,.2,1); } @keyframes tpop { from { opacity: 0; transform: translateY(-3px); } } }
.tml { font-size: .875rem; color: var(--ink-2); }
.tml .term { color: var(--ink); }
.verdict { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
[data-preset="matcha"] .verdict { font-weight: 400; font-size: 1.45rem; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.src { font-size: .8125rem; line-height: 1.5; color: var(--ink-3); }
.sure { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; font-size: .9375rem; color: var(--ink-2); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 999px; }
.seg button { font: inherit; font-size: .875rem; font-weight: 700; border: 0; background: transparent; color: var(--ink-2); padding: 0 14px; min-height: 32px; border-radius: 999px; cursor: pointer; }

<script>
// ---------- store ----------
// Backend: claude db when available, else localStorage ("hub:" prefix). All collections load once into memory; writes go through.
window.HUB_SEED = window.HUB_SEED || null; // tests may set this before the script runs
const SEED = {};
const CONTENT = ['concepts', 'questions', 'quizzes', 'meta', 'exams', 'notes', 'content', 'formulas', 'terms'];
const USER = ['attempts', 'srs', 'flags', 'progress', 'prefs', 'sittings', 'requests', 'reports', 'ticks'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const noteFail = () => { const n = $('#note'); if (n) n.hidden = false; };

const Store = {
  db: null, data: {}, chain: {},
  async init() {
    let db = null;
    try { if (window.claude && claude.use) db = await claude.use('db'); } catch (e) { db = null; }
    this.db = db;
    const seed = Object.assign({}, SEED, window.HUB_SEED || {});
    for (const c of CONTENT.concat(USER)) {
      this.data[c] = {};

const fsAll = unit => Object.entries(Store.all('formulas')).filter(([, f]) => f && unitKey(f.unit) === unitKey(unit) && typeof f.name === 'string' && typeof f.tex === 'string')
  .map(([id, f]) => Object.assign({ id }, f)).sort((a, b) => wkNum(a.week) - wkNum(b.week) || (+a.order || 0) - (+b.order || 0));

function fsFor(q) {

}
// Several equations joined by ",\quad" each get their own line.
const fsParts = t => {

    const c = t[i];
    if (c === '{') d++; else if (c === '}') d--;
    else if (c === ',' && d === 0) { const m = /^,\s*\\q?quad\s*/.exec(t.slice(i)); if (m) { out.push(t.slice(s, i)); s = i + m[0].length; i = s - 1; } }

const fsRow = f => `<div class="fsr"><span>${esc(f.name)}${f.extra ? ' <span class="tag">Not on the sheet</span>' : ''}</span><div>${fsParts(f.tex).map(p => `\\[${esc(p)}\\]`).join('')}</div></div>`;
// The quiz's formulas open in a side panel (a bottom sheet on phones) that floats over the page, so the question never moves.
// It stays open from question to question, showing each one's formulas.
function fsBox(F) {
  const w = $('#fsw'); if (!w) return;
  w.hidden = !fsOpen || !F.length;
  w.innerHTML = w.hidden ? '' : `<div class="pal-h"><p>From the formula sheet</p><button class="x" id="fsx" aria-label="Close formulas">${icon('x')}</button></div><div class="fsp-b">${F.map(fsRow).join('')}</div>`;
  if (!w.hidden) { $('#fsx').onclick = () => { fsOpen = false; fsBox(F); const b = $('#fsb'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } }; typeset(w); }
}
// In a practice exam the official sheet opens in the same panel: beside the paper from 1100px, under the question card below that (the exam bar stays stuck at the top, so the button is always in reach).
// The current question's formulas come first; the rest of the sheet sits below in week folds, closed to start. It stays open from question to question.
function exSheet(unit, open) {
  const w = $('#fsw'), b = $('#fsb'); if (!w) return;
  w.hidden = !open; if (b) b.setAttribute('aria-expanded', String(open));
  if (!open) { w.innerHTML = ''; w.dataset.q = ''; return; }
  const q = ex && ex.Q[ex.s.i || 0]; if (q && w.dataset.q === q.id) return; // already showing this question
  const wasOpen = new Set([...w.querySelectorAll('details[open]')].map(d => d.dataset.w));
  const F = fsAll(unit).filter(f => !f.extra), mine = q ? fsFor(q).filter(f => !f.extra) : [], ids = new Set(mine.map(f => f.id));
  const rest = F.filter(f => !ids.has(f.id)), wks = [...new Set(rest.map(f => wkNum(f.week)))].sort((a, b) => (a || 99) - (b || 99)); // week 0 = general maths, last
  w.style.top = $('#strip').offsetTop + 'px'; // beside the paper, level with the question strip (only used from 1100px)
  w.innerHTML = `<div class="pal-h"><p>Formula sheet</p><button class="x" id="fsx" aria-label="Close formula sheet">${icon('x')}</button></div>
    <div class="fsp-b fsl"><h3>This question</h3>${mine.length ? mine.map(fsRow).join('') : '<p class="muted" style="margin:0">Nothing on the sheet is tagged for this one.</p>'}</div>
    <div class="fsks">${wks.map(k => { const R = rest.filter(f => wkNum(f.week) === k);
      return `<details class="wk fsk" data-w="${k}"${wasOpen.has(String(k)) ? ' open' : ''}><summary><span class="wn">${k ? 'Week ' + k : 'General'}<small>${R.length} ${R.length === 1 ? 'formula' : 'formulas'}</small></span><svg class="ic chev" aria-hidden="true"><use href="#i-down"/></svg></summary><div class="fsp-b"></div></details>`; }).join('')}</div>`;
  w.dataset.q = q ? q.id : '';
  $('#fsx').onclick = () => { exSheet(unit, false); if (b) b.focus(); };
  // A closed fold has no width, so MathJax can't line-break inside it: fill and typeset each fold when it first opens.
  const fold = d => { if (!d.open || d.dataset.ts) return; d.dataset.ts = '1'; const k = +d.dataset.w, x = d.querySelector('.fsp-b');
    x.innerHTML = rest.filter(f => wkNum(f.week) === k).map(fsRow).join(''); typeset(x); };
  w.querySelectorAll('details.fsk').forEach(d => d.addEventListener('toggle', () => fold(d)));
  typeset(w.querySelector('.fsl')); w.querySelectorAll('details.fsk[open]').forEach(fold);
}

// Hints opened on a question before it was answered: run.hint = Map qid -> Set of what was opened ('Formulas', or a term).
function noteHint(qid, what) { if (!study().hintPen) return; run.hint = run.hint instanceof Map ? run.hint : new Map(); (run.hint.get(qid) || run.hint.set(qid, new Set()).get(qid)).add(what); }

// With hint penalties on, the first hint on an unanswered question asks first. Later ones on the same question don't.
async function hintGate(q, answered) {
  if (answered || !study().hintPen || (run.hint instanceof Map && run.hint.has(q.id))) return true;
  return !!(await askDlg({ title: 'Use a hint?', body: 'If you get this one right it will be marked “right, with a hint” and come back sooner. You can turn this off in Settings, Study.', ok: 'Use hint' }));
}

// ----- key terms: terms/<id> = {unit, week, term, aka?, def (exact), simple (plain words), concepts?, link?{d}} -----
const tmAll = unit => Object.entries(Store.all('terms')).filter(([, t]) => t && unitKey(t.unit) === unitKey(unit) && typeof t.term === 'string' && t.term.trim() && (t.def || t.simple))
  .map(([id, t]) => Object.assign({ id }, t));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// One regex per unit: every name and alias, longest first, whole words only.
const TMRE = {};
function tmIndex(unit) {
  const k = unitKey(unit), T = tmAll(unit), sig = T.map(t => t.id).join();
  if (TMRE[k] && TMRE[k].sig === sig) return TMRE[k];
  const by = new Map(); T.forEach(t => [t.term].concat(Array.isArray(t.aka) ? t.aka : []).forEach(n => { n = String(n || '').trim(); if (n.length > 1 && !by.has(n.toLowerCase())) by.set(n.toLowerCase(), t); }));
  const names = [...by.keys()].sort((a, b) => b.length - a.length);
  return TMRE[k] = { sig, by, re: names.length ? new RegExp(`(?<![\\w-])(${names.map(reEsc).join('|')})(?![\\w-])`, 'gi') : null };
}
// Underline the first use of each term in el. Runs before MathJax, so text inside \( \), \[ \] or $$ $$ is left alone.
function termify(el, unit, seen) {
  const ix = tmIndex(unit); if (!el || !ix.re) return [];
  const found = [], tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('button, a, code, pre, .term, mjx-container') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n => {
    const s = n.nodeValue, math = [...s.matchAll(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$/g)].map(m => [m.index, m.index + m[0].length]);
    const hits = []; ix.re.lastIndex = 0; let m;
    while ((m = ix.re.exec(s))) { const t = ix.by.get(m[1].toLowerCase()), a = m.index, b = a + m[1].length;
      if (seen.has(t.id) || math.some(([x, y]) => a < y && b > x)) continue; seen.add(t.id); found.push(t); hits.push([a, b, t]); }
    if (!hits.length) return;
    const f = document.createDocumentFragment(); let at = 0;
    hits.forEach(([a, b, t]) => { f.append(s.slice(at, a)); const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'term'; btn.dataset.t = t.id; btn.setAttribute('aria-expanded', 'false'); btn.textContent = s.slice(a, b); f.append(btn); at = b; });
    f.append(s.slice(at)); n.replaceWith(f);
  });
  return found;
}
// The term's definition in a bubble under the word (above it when there's no room below). Tap again, tap elsewhere or Esc closes it.
function termClose(focus) {
  const p = $('#tpop'); if (!p) return; const b = document.querySelector('.term[aria-expanded="true"]');
  p.remove(); document.removeEventListener('pointerdown', termOut, true); document.removeEventListener('keydown', termKey, true); window.removeEventListener('resize', termClose);
  if (b) { b.setAttribute('aria-expanded', 'false'); if (focus) b.focus(); }
}
const termOut = e => { if (!e.target.closest('#tpop, .term[aria-expanded="true"]')) termClose(); };
const termKey = e => { if (e.key === 'Escape') { e.preventDefault(); termClose(true); } };
function termPlace(p, btn) {
  const r = btn.getClientRects()[0] || btn.getBoundingClientRect(), vw = document.documentElement.clientWidth, w = p.offsetWidth, h = p.offsetHeight;
  const x = Math.max(16, Math.min(r.left + r.width / 2 - w / 2, vw - 16 - w)), below = r.bottom + 10 + h <= innerHeight - 8 || r.top - 10 - h < 8;
  p.classList.toggle('up', !below);
  p.style.left = (x + scrollX) + 'px'; p.style.top = ((below ? r.bottom + 10 : r.top - 10 - h) + scrollY) + 'px';
  p.style.setProperty('--ax', Math.max(14, Math.min(r.left + r.width / 2 - x, w - 14)) + 'px');
}
function termBox(btn, q, answered) {
  const t = Object.assign({ id: btn.dataset.t }, Store.get('terms/' + btn.dataset.t)), open = btn.getAttribute('aria-expanded') === 'true';
  termClose(); if (open || !t.term) return;
  if (!answered) noteHint(q.id, t.term);
  document.body.insertAdjacentHTML('beforeend', `<div class="cmenu tpop" id="tpop" role="dialog" aria-label="${esc(t.term)}"><p>${esc(t.term)}</p><div class="fsr"><div>${H(t.simple || t.def)}</div></div>${links({ link: { d: (t.link || {}).d } }, true, false)}</div>`);
  const p = $('#tpop'); btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-controls', 'tpop');
  termPlace(p, btn);
  const tp = typeset(p); if (tp) tp.then(() => p.isConnected && termPlace(p, btn));

function wireTerms(root, q, answered) { root.querySelectorAll('.term').forEach(b => b.onclick = async () => {
  if (b.getAttribute('aria-expanded') !== 'true' && !(await hintGate(q, answered))) return; termBox(b, q, answered); }); }

function showQuiz() {
  termClose();
  if (!$('#strip')) quizShell();
  strip();
  const c = $('#card'), n = run.qids.length;
  c.className = 'sheet';
  if (!n) { c.innerHTML = `<div class="body"><p class="empty">${run.quiz.indexOf('due') === 0 ? 'Nothing is due today. Your next reviews will show up here.' : 'No questions here yet.'}</p><div><a class="btn out" href="#/">${icon('left')}Home</a></div></div>`; drawMark = false; return; }
  if (run.i >= n) return summary();
  const q = run.Q[run.i], i = run.i, r = run.res[q.id], mk = markKind(r, run.skipped.has(q.id));
  const body = q.o ? `<div class="opts">${q.o.map((t, k) => `<button class="opt" id="o${k}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${H(t)}</span></button>`).join('')}</div>`
    : `<form class="numf" id="nf"><input id="nin" inputmode="decimal" aria-label="Your answer" placeholder="Your answer" autocomplete="off"><button class="btn" type="submit">Check</button></form>`;
  const flagged = Object.values(Store.all('flags')).some(f => f.qid === q.id && !f.resolved);
  const F = study().hints ? fsFor(q) : [], hb = hintOk(q);
  if (hintQ !== q.id) { hintQ = q.id; hintOpen = false; }
  // Hint and Formulas sit above the question; what they open drops in under them, so neither button moves.
  const tools = F.length || hb ? `<div class="qtools">${F.length ? `<button class="btn out sm" id="fsb" aria-expanded="${fsOpen}" aria-controls="fsw">${icon('sigma')}Formulas</button>` : ''}${hb ? `<button class="btn out sm" id="hintb" aria-expanded="${hintOpen}" aria-controls="hintw">${icon('spark')}Hint</button>` : ''}</div>
    <aside class="cmenu fsp hintp" id="hintw" aria-label="Hint" hidden></aside><aside class="cmenu fsp" id="fsw" aria-label="Formulas" hidden></aside>` : '';
  c.innerHTML = `<div class="head"><span class="qn">Q${i + 1}</span><span class="wkt">${esc(q.w)}</span><span id="mkw">${mark(mk, drawMark)}</span></div>
    <div class="body">${tools}<div class="q">${H(q.q)}</div>${!r && run.skipped.has(q.id) ? '<div class="state">You skipped this one earlier.</div>' : ''}${body}<div id="fbw"></div>
    <div class="qnav"><span><button class="btn out" id="prev" ${i === 0 ? 'disabled' : ''}>${icon('left')}Back</button><button class="btn out" id="flag" ${flagged ? 'disabled' : ''}>${icon('flag')}${flagged ? 'Flagged' : 'Flag'}</button></span>
    <span>${r ? '' : '<button class="btn out" id="skip">Skip</button>'}<button class="btn${r ? '' : ' out'}" id="next">${r ? 'Next question' : 'Next'}${icon('right')}</button></span></div>
    <div id="flagw"></div></div>`;
  $('#prev').onclick = () => go(i - 1);
  $('#next').onclick = () => r ? go(nextOpen()) : go(i + 1);
  if ($('#skip')) $('#skip').onclick = () => { run.skipped.add(q.id); go(nextOpen()); };
  $('#flag').onclick = () => { flagOpen = !flagOpen; flagBox(q); };
  if (F.length) $('#fsb').onclick = async () => { if (!fsOpen && !(await hintGate(q, !!r))) return; fsOpen = !fsOpen; if (fsOpen && !r) noteHint(q.id, 'Formulas'); fsBox(F); $('#fsb').setAttribute('aria-expanded', String(fsOpen)); };
  fsBox(F);
  if (hb) { $('#hintb').onclick = async () => { if (!hintOpen && !(await hintGate(q, !!r))) return; hintOpen = !hintOpen; if (hintOpen && !r) noteHint(q.id, 'Hint'); $('#hintb').setAttribute('aria-expanded', String(hintOpen)); hintBox(q); }; hintBox(q); }
  // Before answering only the question is tappable: definitions in the options would give the answer away.
  run.tseen = new Set(); if (study().hints) { termify(c.querySelector('.q'), q.unit, run.tseen); wireTerms(c.querySelector('.q'), q, !!r); }
  if (r) feedback(); else {
    if (q.o) c.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
    else $('#nf').onsubmit = e => { e.preventDefault(); const v = parseFloat($('#nin').value); if (!isNaN(v)) answer(v); };
  }
  flagBox(q);
  typeset(c);
  drawMark = false;
}

function flagBox(q) {
  const w = $('#flagw'); if (!w) return;
  if (!flagOpen) { w.innerHTML = ''; return; }
  w.innerHTML = `<div class="flagbox"><label for="fnote">What looks wrong with this question?</label><textarea id="fnote" placeholder="e.g. the answer should be C, or the units are off"></textarea><div><button class="btn sm" id="fsave" aria-keyshortcuts="Control+Enter Meta+Enter">Save flag${sendHint()}</button></div></div>`;
  $('#fnote').focus();
  sendOnModEnter($('#fnote'), () => $('#fsave').click());
  $('#fsave').onclick = () => { Store.add('flags', { qid: q.id, note: $('#fnote').value.trim(), at: new Date().toISOString(), resolved: false }); flagOpen = false; showQuiz(); };
}

function answer(v) {
  const q = run.Q[run.i], ok = q.o ? v === q.a : Math.abs(v - q.num) <= q.tol;
  const prev = Store.get('srs/' + q.id);
  const used = run.hint instanceof Map && run.hint.get(q.id), hint = used && used.size ? [...used] : undefined;
  const att = Store.add('attempts', Object.assign({ qid: q.id, quiz: run.quiz, ok, pick: v, sure: null, at: new Date().toISOString() }, hint ? { hint } : {}));
  run.res[q.id] = { ok, pick: v, sure: null, hint, att, prev: prev ? Object.assign({}, prev) : null, fresh: true };
  run.skipped.delete(q.id);
  srsApply(q.id, ok, hint ? 0.5 : true, prev); // right with a hint moves up slowly, like "fairly sure"
  drawMark = true;
  persist(); showQuiz(); $('#next').focus();
}

function feedback() {
  const q = run.Q[run.i], c = $('#card'), r = run.res[q.id], ok = r.ok, v = r.pick;
  const why = q.o && !ok && Array.isArray(q.why) && typeof q.why[v] === 'string' && q.why[v].trim();
  if (q.o) c.querySelectorAll('.opt').forEach(b => { b.disabled = true; const k = +b.dataset.k; b.querySelectorAll('.mk').forEach(m => m.remove());
    if (k === q.a) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', mark(r.sure === false && ok ? 'gs' : 'ok')); }
    else if (k === v) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', (why ? `<span class="owhy"><b>Why not:</b> ${H(q.why[v])}</span>` : '') + mark('no')); } });
  else { $('#nin').value = v; $('#nin').disabled = true; const cb = c.querySelector('#nf .btn'); if (cb) cb.remove(); }
  const sure = ok && study().sure ? `<div class="sure"><span>How sure were you?</span><span class="seg" role="group" aria-label="How sure were you?"><button data-s="1" aria-pressed="${r.sure === true}">Sure</button><button data-s="0.5" aria-pressed="${r.sure === 0.5}">Fairly sure</button><button data-s="0" aria-pressed="${r.sure === false}">Guessed</button></span></div>` : '';
  const hinted = Array.isArray(r.hint) && r.hint.length ? `<div class="tml">Hints used before answering: ${r.hint.map(esc).join(', ')}</div>` : '';
  $('#fbw').innerHTML = `<div class="fb"><div class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct' : 'Not quite. The answer is ' + (q.o ? 'ABCD'[q.a] : `<span class="n">${esc(q.num)}</span>`)}</div><div class="fbe">${H(q.e)}</div><div class="src">${H(q.s)}</div>${hinted}<div class="tml" hidden></div>${sure}${links(q, ok)}${askBtn(q.id)}</div>`;
  if (study().hints) {
    // After answering, every term is open: underlined in the explanation, and the rest (from the options) listed.
    const stem = new Set([...document.querySelectorAll('#card .q .term')].map(b => b.dataset.t)), seen = new Set(stem);
    const fbw = $('#fbw'); termify(fbw.querySelector('.fbe'), q.unit, seen);
    const opt = []; if (q.o) q.o.forEach(t => { const d = document.createElement('div'); d.innerHTML = H(t); termify(d, q.unit, seen).forEach(x => opt.push(x)); });
    const tl = fbw.querySelector('.tml[hidden]');
    if (opt.length) { tl.innerHTML = `Terms in the options: ${opt.map(t => `<button type="button" class="term" data-t="${esc(t.id)}" aria-expanded="false">${esc(t.term)}</button>`).join(', ')}`; tl.hidden = false; }
    wireTerms(fbw, q, true); wireTerms($('#card .q'), q, true);

  $('#fbw').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    r.sure = b.dataset.s === '1' ? true : b.dataset.s === '0' ? false : 0.5; Store.update('attempts/' + r.att, { sure: r.sure });
    if (r.fresh) srsApply(q.id, true, r.hint && r.sure === true ? 0.5 : r.sure, r.prev);
    persist();
    $('#mkw').innerHTML = mark(markKind(r, false));
    strip(); feedback(); typeset($('#fbw'));
  });
  wireAsk($('#fbw'), () => ({ pick: r.pick, ok: r.ok }));
  if (nextOpen() >= run.qids.length) $('#next').innerHTML = `See results${icon('right')}`;
}

function summary() {
  const c = $('#card'), n = run.qids.length, right = run.qids.filter(id => run.res[id] && run.res[id].ok).length;
  const miss = run.Q.map((q, k) => [q, k]).filter(([q]) => run.res[q.id] && !run.res[q.id].ok);
  const open = run.Q.map((q, k) => [q, k]).filter(([q]) => !run.res[q.id]);
  const helped = run.Q.map((q, k) => [q, k]).filter(([q]) => run.res[q.id] && run.res[q.id].ok && run.res[q.id].hint);
  const item = ([q, k]) => `<li><a href="#" class="jump" data-k="${k}">Q${k + 1}</a> <span class="muted">${esc(q.w)}</span><div>${H(q.q)}</div>${links(q, true, false)}</li>`;
  const S = stats(), seen = new Set(); run.Q.forEach(q => (q.concepts || []).forEach(x => seen.add(x)));
  const weak = [...seen].filter(x => S.con[x] && S.con[x].m < 0.8).sort((a, b) => S.con[a].m - S.con[b].m).slice(0, 3).map(x => esc((Store.all('concepts')[x] || {}).name || x));
  c.innerHTML = `<div class="head"><span class="qn">Results</span></div><div class="body">
    <div class="result"><span class="big">${right} / ${n}</span><span class="muted">right</span></div>
    ${weak.length ? `<p class="muted" style="margin:0">Weakest concepts here: ${weak.join(', ')}</p>` : ''}
    ${miss.length ? `<div class="box"><h2>Revisit</h2><ul class="sum">${miss.map(item).join('')}</ul></div>` : ''}
    ${helped.length ? `<div class="box"><h2>Right with a hint</h2><ul class="sum">${helped.map(item).join('')}</ul></div>` : ''}
    ${open.length ? `<div class="box"><h2>Skipped or not answered</h2><ul class="sum">${open.map(item).join('')}</ul></div>` : ''}
    ${!miss.length && !open.length && !helped.length ? '<p style="margin:0">Clean sweep.</p>' : ''}
    <div class="qnav"><span><button class="btn out" id="back">${icon('left')}Back to questions</button></span><span><a class="btn" href="${run.unit ? '#/u/' + encodeURIComponent(run.unit) : '#/'}">Done</a></span></div></div>`;
  c.querySelectorAll('.jump').forEach(a => a.onclick = e => { e.preventDefault(); go(+a.dataset.k); });
  $('#back').onclick = () => go(open.length ? open[0][1] : n - 1);
  typeset(c); strip(); drawMark = false;
}

// Generated sessions (weak spots, due reviews) can be narrowed to one unit. Replaces the earlier buildRun.
function buildRun(route) {
  const Qs = Store.all('questions'), inUnit = q => isAuto(q) && (!route.unit || unitKey(q.unit) === route.unit); let r;
  if (route.kind === 'quiz') {
    const z = Store.all('quizzes')[route.id]; if (!z) return null;
    const pr = Store.get('progress/' + route.id) || {}, lat = latestIn(route.id), res = {};
    Object.entries(lat).forEach(([q, a]) => res[q] = toRes(a));
    const open = z.qids.findIndex(q => !res[q]);
    r = { key: route.id, quiz: route.id, unit: unitKey(z.unit), title: z.title, qids: z.qids.filter(q => Qs[q]), i: pr.i != null ? pr.i : Math.max(open, 0), skipped: new Set((pr.skipped || []).filter(q => !res[q])), res, persistent: true };
  } else {
    const sk = 'hub:sess:' + route.key, saved = ssGet(sk); let st = null;
    try { st = saved && JSON.parse(saved); } catch (e) {}
    const con = route.kind === 'concept' ? Store.all('concepts')[route.id] || {} : null;
    const title = route.kind === 'weak' ? 'Revise weak spots' : route.kind === 'due' ? 'Due reviews' : route.kind === 'mistakes' ? 'Revise mistakes' : 'Practice: ' + (con.name || 'concept');
    if (!st) {
      const qids = route.kind === 'weak' ? weakIds(study().n, inUnit)
        : route.kind === 'due' ? dueIds().filter(id => Qs[id] && inUnit(Qs[id]))
        : route.kind === 'mistakes' ? mistIds(route.unit)
        : weakIds(study().n, q => isAuto(q) && (q.concepts || []).includes(route.id));
      st = { qids, i: 0, skipped: [], res: {} };

    const quiz = route.kind === 'concept' ? 'concept:' + route.id : route.kind + (route.unit ? ':' + route.unit : '');
    r = { key: route.key, quiz, unit: route.unit || (con ? unitKey(con.unit) : ''), title, qids: st.qids.filter(q => Qs[q]), i: st.i, skipped: new Set(st.skipped), res: st.res, persistent: false, sk };
  }
  r.Q = r.qids.map(id => Object.assign({ id }, Qs[id]));
  return r;
}

// ---------- practice exams ----------
// exams/<id>: {unit, title, created, minutes, qids[], marks?: {qid: n}, intro?}
// sittings/<id>: {exam, unit, started, timed, minutes, ends, ans: {qid: pick}, rev: [qid], i, done, finished, self: {qid: 0|.5|1}, selfAtt: {qid: attemptId}}
// Written questions have `ans` (a model answer) instead of options or a number; they are self-marked after the exam.
const isAuto = q => !!q && (!!q.o || q.num != null);
const isRight = (q, a) => q.o ? +a === q.a : Math.abs(parseFloat(a) - q.num) <= q.tol;
const hasAns = a => a != null && String(a).trim() !== '';
const exMarks = (z, qid) => (z.marks && z.marks[qid]) || 1;
const exTotal = z => z.qids.reduce((s, q) => s + exMarks(z, q), 0);
const examsOf = key => Object.entries(Store.all('exams')).filter(([, z]) => unitKey(z.unit) === key).sort((a, b) => a[1].created < b[1].created ? 1 : -1);
const sitsOf = id => Object.entries(Store.all('sittings')).filter(([, s]) => s && s.exam === id).sort((a, b) => a[1].started < b[1].started ? 1 : -1);
function exScore(z, s) {
  const Qs = Store.all('questions'); let got = 0, pending = 0;
  z.qids.forEach(id => { const q = Qs[id], m = exMarks(z, id), a = (s.ans || {})[id]; if (!q) return;
    if (isAuto(q)) { if (hasAns(a) && isRight(q, a)) got += m; }
    else { const v = (s.self || {})[id]; if (v != null) got += m * v; else pending++; } });
  return { got, total: exTotal(z), pending };
}
const fmtDur = ms => { const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const mins = ms => { const m = Math.round(ms / 6e4); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const shortDate = iso => new Intl.DateTimeFormat('en-AU', { timeZone: 'Australia/Melbourne', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));

let ex = null, exTick = null, exPend = null;
function exStop() { if (exTick) clearInterval(exTick); exTick = null; if (exPend) { exPend(); exPend = null; } }
function exSave(patch) { if ('ans' in patch) patch.at = new Date().toISOString(); Store.update('sittings/' + ex.sid, patch); ex.s = Store.get('sittings/' + ex.sid); }

function examShell(z, back, sub) {

}
function showExam(id, sid) {

  const uk = unitKey(z.unit), back = { href: '#/u/' + encodeURIComponent(uk) + '/exams', label: (unitList().find(x => x.key === uk) || { unit: z.unit }).unit };
  const Q = z.qids.filter(q => Qs[q]).map(q => Object.assign({ id: q }, Qs[q]));
  if (sid && Store.get('sittings/' + sid)) return exReview(id, z, Q, sid, back);

function exStart(id, z, Q, back) {

    <dl class="facts"><div><dt>Questions</dt><dd>${Q.length}</dd></div><div><dt>Marks</dt><dd>${exTotal(z)}</dd></div><div><dt>Suggested time</dt><dd>${M} min</dd></div></dl>

function exRun(id, z, Q, sid, back) {

  app().innerHTML = examShell(z, back, ex.s.timed ? `Timed · ${ex.s.minutes} min` : 'Untimed') + `
    <div class="exbar"><span class="timer" id="tmr">${icon('clock')}<span></span></span><span class="prog" id="exprog"></span><span class="sp"></span>${study().hints && fsAll(z.unit).some(f => !f.extra) ? `<button class="btn sm out" id="fsb" aria-expanded="false" aria-controls="fsw">${icon('sigma')}Formula sheet</button>` : ''}<button class="btn sm" id="fin">Finish exam</button></div>

}
function exStrip() {

}
function exGo(k) { if (exPend) { exPend(); exPend = null; } exSave({ i: Math.max(0, Math.min(k, ex.Q.length - 1)) }); exStrip(); exCard(); window.scrollTo({ top: 0 }); }

function exConfirm() {

  d.innerHTML = `<h2 id="dlg-t">Finish the exam?</h2><p class="muted" style="margin:0">${open ? `${open} ${open === 1 ? 'question has' : 'questions have'} no answer. ` : 'Every question has an answer. '}${rv ? `${rv} marked for review.` : ''}</p>

function exReview(id, z, Q, sid, back) {
  const s = Store.get('sittings/' + sid), r = exScore(z, s), pct = r.total ? Math.round(100 * r.got / r.total) : 0;
  const S = stats(), seen = new Set(); Q.forEach(q => { const a = s.ans[q.id]; if (isAuto(q) && !(hasAns(a) && isRight(q, a))) (q.concepts || []).forEach(x => seen.add(x)); });
  const weak = [...seen].slice(0, 4).map(x => esc((Store.all('concepts')[x] || {}).name || x));
  const item = (q, k) => {
    const a = s.ans[q.id], m = exMarks(z, q.id), auto = isAuto(q), sv = (s.self || {})[q.id];
    const got = auto ? (hasAns(a) && isRight(q, a) ? m : 0) : sv != null ? m * sv : null;
    const cls = got == null ? '' : got >= m ? 'ok' : got > 0 ? 'part' : 'no';
    let ans = '';
    if (q.o) ans = `<div class="opts">${q.o.map((t, j) => `<button class="opt${j === q.a ? ' right' : hasAns(a) && +a === j ? ' wrong' : ''}" disabled><span class="k">${'ABCD'[j]}</span><span>${H(t)}</span>${j === q.a ? mark('ok') : hasAns(a) && +a === j ? mark('no') : ''}</button>`).join('')}</div>${hasAns(a) ? '' : '<p class="yours">You left this blank.</p>'}`;
    else if (q.num != null) ans = `<p class="yours">Your answer: <b class="n">${hasAns(a) ? esc(String(a)) : 'blank'}</b> · Correct: <b class="n">${esc(q.num)}</b></p>`;
    else ans = `<p class="yours" style="white-space:pre-wrap">${hasAns(a) ? esc(String(a)) : 'No typed answer. Mark your working on paper against this.'}</p><div class="model"><p>Model answer</p>${H(q.ans)}</div>
      <div class="sure"><span>Your mark${m > 1 ? ` (out of ${m})` : ''}</span>${m <= 2
        ? `<span class="seg" role="group" aria-label="Mark Q${k + 1}">${Array.from({ length: m * 2 + 1 }, (_, j) => m - j / 2).map(v => `<button data-q="${esc(q.id)}" data-v="${v / m}" aria-pressed="${sv != null && Math.abs(sv * m - v) < 1e-9}">${v}</button>`).join('')}</span>`
        : `<span class="timed"><input type="number" class="mkin" data-q="${esc(q.id)}" data-m="${m}" min="0" max="${m}" step="0.5" value="${sv != null ? +(sv * m).toFixed(1) : ''}" placeholder="–" aria-label="Mark Q${k + 1} out of ${m}"> / ${m}</span>`}</div>`;
    const open = cls !== 'ok';
    return `<details class="rev-q"${open ? ' open' : ''}><summary><b>Q${k + 1}</b><span class="wkt tag">${esc(q.w || '')}</span><span class="pts ${cls}">${got == null ? 'to mark' : `${got}/${m}`}</span><svg class="ic chev" aria-hidden="true"><use href="#i-down"/></svg></summary>
      <div class="rb"><div class="q">${H(q.q)}</div>${ans}${q.e ? `<div>${H(q.e)}</div>` : ''}${q.s ? `<div class="src">${H(q.s)}</div>` : ''}${links(q, cls === 'ok')}${askBtn(q.id)}</div></details>`;
  };
  app().innerHTML = examShell(z, back, 'Results') + `<section class="sheet"><div class="body">
    ${s.timeUp ? '<p class="state" style="margin:0;color:var(--bad);font-weight:700">Time ran out, so the exam was handed in.</p>' : ''}
    <div class="result"><span class="big">${r.got} / ${r.total}</span><span class="muted">marks · ${pct}% · ${mins(new Date(s.finished) - new Date(s.started))}${s.timed ? ` of ${s.minutes}` : ''}</span></div>
    ${r.pending ? `<p style="margin:0">Mark your ${r.pending} written ${r.pending === 1 ? 'answer' : 'answers'} below to finish your score.</p>` : ''}
    ${weak.length ? `<p class="muted" style="margin:0">Lost marks on: ${weak.join(', ')}</p>` : ''}
    <div>${Q.map(item).join('')}</div>
    <div class="qnav"><span><a class="btn out" href="${back.href}">${icon('left')}All exams</a></span><span><a class="btn" href="#/exam/${encodeURIComponent(id)}">Try again</a></span></div></div></section></main>`;
  const setSelf = (qid, v) => {
    const cur = Store.get('sittings/' + sid), self = Object.assign({}, cur.self, { [qid]: v }), sa = Object.assign({}, cur.selfAtt);
    const att = { qid, quiz: 'exam:' + id, ok: v > 0, pick: null, sure: v > 0 && v < 1 ? false : null, at: new Date().toISOString() };
    if (sa[qid] && Store.get('attempts/' + sa[qid])) Store.update('attempts/' + sa[qid], att); else sa[qid] = Store.add('attempts', att);
    Store.update('sittings/' + sid, { self, selfAtt: sa });
    const y = window.scrollY; exReview(id, z, Q, sid, back); window.scrollTo(0, y);
  };
  app().querySelectorAll('[data-v]').forEach(b => b.onclick = () => setSelf(b.dataset.q, +b.dataset.v));
  app().querySelectorAll('.mkin').forEach(n => n.onchange = () => { const m = +n.dataset.m, v = parseFloat(n.value);

  wireAsk(app(), q => { const a = s.ans[q.id]; return { pick: hasAns(a) ? a : null, ok: isAuto(q) ? hasAns(a) && isRight(q, a) : null }; });
  typeset(app());
}

// Latest week a list entry covers, and its expected score from concept mastery (untried concepts count as 0.5).
function qMeta(qids, S) {
  const Qs = Store.all('questions'), qs = qids.map(q => Qs[q]).filter(Boolean), cs = [...new Set(qs.flatMap(q => q.concepts || []))];
  return { week: Math.max(0, ...qs.map(q => wkNum(q.week || q.w) || 0)), est: cs.length ? cs.reduce((t, c) => t + (S.con[c] ? S.con[c].m : 0.5), 0) / cs.length : 0.5 };
}
function examsBody(u, S) {
  const xs = examsOf(u.key);
  if (!xs.length) return `<p class="empty">No practice exams yet. ${SOLO ? IMPORT_HINT : 'Tap <b>New</b> above and pick <b>Practice exam</b>.'}</p>`;
  return qlist(u.key, 'exams', xs.map(([id, z]) => {
    const ss = sitsOf(id), live = ss.find(([, s]) => !s.done), done = ss.filter(([, s]) => s.done);
    const best = done.map(([, s]) => exScore(z, s)).sort((a, b) => b.got - a.got)[0];
    const label = live ? 'Continue' : done.length ? 'Retake' : 'Start';
    const tags = (live ? '<span class="tag live">In progress</span>' : '') + (best ? `<span class="tag">Best ${best.got}/${best.total}</span><span class="tag">${done.length} ${done.length === 1 ? 'attempt' : 'attempts'}</span>` : '');
    const qm = qMeta(z.qids, S), m = { created: z.created, week: qm.week, done: done.length ? 1 : live ? 0.5 : 0, last: (ss[0] || [, {}])[1].started || '', est: best && best.total ? best.got / best.total : qm.est };
    return [id, z, { m, text: `<h3>${esc(z.title)}</h3><div class="meta"><span class="n">${z.qids.length}</span> questions · <span class="n">${exTotal(z)}</span> marks · <span class="n">${z.minutes || 60}</span> min</div>`, tags,
      btn: `<a class="btn ${done.length && !live ? 'out ' : ''}sm" href="#/exam/${encodeURIComponent(id)}" aria-label="${label} ${esc(z.title)}">${label}${icon('right')}</a>` }, ''];
  }));
}

// ---------- home ----------
const clearSessions = () => { try { Object.keys(sessionStorage).forEach(k => { if (k.indexOf('hub:sess:') === 0) ssDel(k); }); } catch (e) {} };
function ring(f) { const C = 2 * Math.PI * 18; return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle class="bgc" cx="21" cy="21" r="18"/><circle class="fg" cx="21" cy="21" r="18" stroke-dasharray="${(C * f).toFixed(1)} ${C.toFixed(1)}"/></svg>`; }
function lastQuiz() {
  let best = null; const Zs = Store.all('quizzes');
  Object.values(Store.all('attempts')).forEach(a => { if (Zs[a.quiz] && (!best || a.at > best.at)) best = a; });
  if (!best) return null;
  const z = Zs[best.quiz], lat = latestIn(best.quiz), d = z.qids.filter(q => lat[q]).length;
  return d < z.qids.length ? { id: best.quiz, z, d, at: best.at } : null;

  const title = String(d.title || (quiz ? 'Revision quiz' : 'Practice exam')).slice(0, 80), created = today();
  if (quiz) Store.set('quizzes/' + base, { unit: U, title, created, qids, gen: true, purpose: o.purpose || 'review' });
  else Store.set('exams/' + base, { unit: U, title, created, minutes: o.min, qids, marks, intro: 'Written by Claude in the hub from your notes.', gen: true });
  return base;
}

// ----- "Ask Claude" about one question -----
const ASK = {}; // qid -> { turns: [], busy, err, ctl }
function askBtn(qid) { return SOLO || SAMPLE === null || !study().ask ? '' : `<div class="askw" data-ask="${esc(qid)}"></div>`; }
function askCtx(q, ctx) {
  const u = unitList().find(x => x.key === unitKey(q.unit)) || {};
  const note = notesOf(unitKey(q.unit)).find(n => +n.week === wkNum(q.week));
  let ans = '';
  if (q.o) ans = `Options:\n${q.o.map((t, k) => `${'ABCD'[k]}. ${stripTags(t)}${Array.isArray(q.why) && q.why[k] ? ` (why it's wrong: ${stripTags(q.why[k])})` : ''}`).join('\n')}\nCorrect: ${'ABCD'[q.a]}\n`;
  else if (q.num != null) ans = `Correct answer: ${q.num}\n`;
  else if (q.ans) ans = `Model answer: ${stripTags(q.ans)}\n`;
  const mine = ctx.pick == null || ctx.pick === '' ? 'No answer given.' : q.o ? `Picked ${'ABCD'[+ctx.pick]} (${ctx.ok ? 'right' : 'wrong'})` : `Answered: ${String(ctx.pick).slice(0, 1500)}${ctx.ok == null ? '' : ctx.ok ? ' (right)' : ' (wrong)'}`;
  return `You are a patient tutor helping a university student revise ${u.unit || q.unit}${u.name ? ' (' + u.name + ')' : ''}. They are looking at one practice question and want help with it.
Answer in under 150 words unless they ask for more. Plain language, short paragraphs. Maths with \\( … \\) inline or \\[ … \\] on its own line, never $. You may use **bold** and \`code\`. No headings.
If they ask for a similar question, give one new question and stop. Wait for their answer before revealing the solution.

QUESTION: ${stripTags(q.q)}
${ans}Explanation they were shown: ${stripTags(q.e) || '(none)'}
Student: ${mine}
${note ? `\nTheir course notes for week ${note.week} (excerpt):\n${String(note.text || '').slice(0, 8000)}` : ''}`;
}
function drawAsk(w, q, ctx) {
  const st = ASK[q.id] = ASK[q.id] || { turns: [], open: false }, wrong = ctx.ok === false;
  if (!st.open) { w.innerHTML = `<button class="btn out sm askb">${icon('spark')}Ask Claude about this</button>`; w.querySelector('.askb').onclick = () => { st.open = true; drawAsk(w, q, ctx); w.querySelector('input') && w.querySelector('input').focus(); }; return; }
  const chips = (wrong ? ['Why is my answer wrong?', `Why is ${q.o ? 'ABCD'[q.a] : 'that'} the answer?`] : ['Why is this the answer?']).concat(['Explain the key terms', 'Give me a similar one to try']);
  w.innerHTML = `<div class="ask">${st.turns.map(t => `<div class="msg ${t.role === 'user' ? 'me' : 'cl'}">${t.role === 'user' ? esc(t.content) : md(t.content)}</div>`).join('')}
    ${st.busy ? `<div class="msg cl live"><span class="thinking">Thinking</span></div>` : ''}${st.err ? `<p class="aerr">${esc(st.err)}</p>` : ''}
    ${st.turns.length || st.busy ? '' : `<div class="chips">${chips.map(c => `<button class="chip2">${c}</button>`).join('')}</div>`}
    <form class="askf"><input placeholder="${st.turns.length ? 'Ask a follow-up' : 'Or type your own question'}" aria-label="Ask Claude" ${st.busy ? 'disabled' : ''}>${st.busy ? `<button type="button" class="btn out sm" id="astop">Stop</button>` : `<button class="btn sm">Ask</button>`}</form></div>`;
  w.querySelectorAll('.chip2').forEach(b => b.onclick = () => sendAsk(w, q, ctx, b.textContent));
  w.querySelector('.askf').onsubmit = e => { e.preventDefault(); const v = w.querySelector('input').value.trim(); if (v) sendAsk(w, q, ctx, v); };
  sendOnModEnter(w.querySelector('.askf input'), () => w.querySelector('.askf').requestSubmit());
  if (w.querySelector('#astop')) w.querySelector('#astop').onclick = () => st.ctl && st.ctl.abort();
  typeset(w);
}
async function sendAsk(w, q, ctx, text) {
  const st = ASK[q.id]; if (st.busy) return;
  // Show the question and "Thinking" straight away: the Claude connection can take a few seconds to come up.
  const ctl = st.ctl = new AbortController();
  st.turns.push({ role: 'user', content: text }); st.busy = true; st.err = ''; drawAsk(w, q, ctx);
  const sample = SAMPLE === undefined ? await sampleReady : SAMPLE;
  if (!sample || ctl.signal.aborted) { st.turns.pop(); st.busy = false; st.ctl = null; st.err = sample ? '' : 'Claude isn’t switched on for this page.'; return drawAsk(w, q, ctx); }
  const turns = st.turns.slice(-12);
  try {
    const { text: out } = await sample([{ role: 'user', content: askCtx(q, ctx) }].concat(turns), { cache: false, signal: ctl.signal,
      onText: ({ text: t }) => { const live = w.isConnected && w.querySelector('.live'); if (live) live.innerHTML = md(t); } });
    st.turns.push({ role: 'assistant', content: out });
  } catch (e) {
    if (e && e.text) st.turns.push({ role: 'assistant', content: e.text + (e.code === 'cancelled' ? '' : ' …') });
    else if (st.turns[st.turns.length - 1].role === 'user' && e && e.code === 'cancelled') st.turns.pop();
    st.err = sErr(e);
  }
  st.busy = false; st.ctl = null;
  const cur = document.querySelector(`[data-ask="${CSS.escape(q.id)}"]`); if (cur) drawAsk(cur, q, ctx);
}
function wireAsk(root, getCtx) {
  (root || document).querySelectorAll('[data-ask]').forEach(w => { const q = Object.assign({ id: w.dataset.ask }, Store.get('questions/' + w.dataset.ask)); if (q.q) drawAsk(w, q, getCtx(q)); });
}
sampleReady.then(s => { if (s === null) document.querySelectorAll('[data-ask]').forEach(w => w.remove()); });

// ----- Hint: a nudge toward the first step, never the answer. The question's own `hint` if it has one, else Claude writes one once and hints/<qid> keeps it. -----
const HINT = {}; // qid -> { busy, err }
const hintOk = q => study().hints && (!!q.hint || !!(Store.get('hints/' + q.id) || {}).text || (!SOLO && SAMPLE !== null));
function hintBox(q) {
  const w = $('#hintw'); if (!w) return;
  const st = HINT[q.id] = HINT[q.id] || {};
  w.hidden = !hintOpen; if (!hintOpen) { w.innerHTML = ''; st.err = ''; return; } // closing clears an error, so opening again retries
  const saved = (Store.get('hints/' + q.id) || {}).text;
  const inner = q.hint ? H(q.hint) : saved ? md(saved) : st.busy ? '<span class="thinking">Thinking</span>' : st.err ? `<p class="aerr">${esc(st.err)}</p>` : '';
  w.innerHTML = `<div class="pal-h"><p>Hint</p><button class="x" id="hintx" aria-label="Close hint">${icon('x')}</button></div><div class="fsp-b" aria-live="polite">${inner}</div>`;
  $('#hintx').onclick = () => { hintOpen = false; hintBox(q); const b = $('#hintb'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } };
  if (!q.hint && !saved && !st.busy && !st.err) getHint(q); else typeset(w);
}
async function getHint(q) {
  const st = HINT[q.id]; st.busy = true; st.err = ''; hintBox(q);
  const sample = SAMPLE === undefined ? await sampleReady : SAMPLE;
  if (!sample) { st.busy = false; st.err = 'Claude isn’t switched on for this page.'; return hintBox(q); }
  const u = unitList().find(x => x.key === unitKey(q.unit)) || {}, note = notesOf(unitKey(q.unit)).find(n => +n.week === wkNum(q.week));
  const ans = q.o ? `Options:\n${q.o.map((t, k) => `${'ABCD'[k]}. ${stripTags(t)}`).join('\n')}\nCorrect: ${'ABCD'[q.a]}` : q.num != null ? `Correct answer: ${q.num}` : q.ans ? `Model answer: ${stripTags(q.ans)}` : '';
  const prompt = `Write ONE hint for a university student stuck on this ${u.unit || q.unit} practice question. One or two short sentences that point them at the right idea or the first step to take.
Never give the answer, the correct option letter, or a final number, and don't rule options in or out by letter. Maths with \\( … \\) only, never $. Plain text, no heading, no preamble.

QUESTION: ${stripTags(q.q)}
${ans}
Explanation shown after answering (for you, don't quote it): ${stripTags(q.e) || '(none)'}
${note ? `\nCourse notes for week ${note.week} (excerpt):\n${String(note.text || '').slice(0, 6000)}` : ''}`;
  try { const { text } = await sample(prompt, { cache: false }); if (text && text.trim()) Store.set('hints/' + q.id, { qid: q.id, text: text.trim(), at: new Date().toISOString() }); else st.err = 'No hint came back. Try again later.'; }
  catch (e) { st.err = sErr(e); }
  st.busy = false;
  if (hintQ === q.id) hintBox(q);
}
sampleReady.then(s => { if (s !== null) return; const b = $('#hintb'), q = typeof run !== 'undefined' && run && run.Q && run.Q[run.i];
  if (b && q && !q.hint && !(Store.get('hints/' + q.id) || {}).text) { b.remove(); const w = $('#hintw'); if (w) w.remove(); } });

// ---------- report a problem ----------
// Reports go to the `reports` collection. Claude files queued ones as GitHub issues on the ma-study repo.
const HUB_VERSION = '1.7.0';
const BUILD = HUB_VERSION;
// Home-page notices: a newer ma-study release (Claude writes prefs/app when it checks GitHub) and a one-time pin tip.
const verGt = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
function notices() {
  const v = Store.get('prefs/app') || {}, out = [];
  if (v.latest && verGt(v.latest, HUB_VERSION)) out.push(`<div class="notice" role="status"><p><b>Study Sauce ${esc(v.latest)} is out.</b> Ask Claude to “update my Study Sauce”.${/^https:\/\/github\.com\//.test(v.url || '') ? ` <a href="${esc(v.url)}" target="_blank" rel="noopener">What’s new</a>` : ''}</p></div>`);
  if (!SOLO && !(PREFS.tips && PREFS.tips.pin)) out.push(`<div class="notice"><p><b>Tip:</b> pin this page so it’s always in your Claude sidebar. Ask Claude to “pin my Study Sauce”.</p><button class="btn out sm" id="pintip">Got it</button></div>`);
  return out.join('');
}
document.addEventListener('click', e => { if (e.target.closest('#pintip')) { PREFS.tips = Object.assign({}, PREFS.tips, { pin: 1 }); savePrefs(); const n = e.target.closest('.notice'); if (n) n.remove(); } });
const RECENT_ERR = [];
const noteErr = m => { RECENT_ERR.push({ m: String(m).slice(0, 300), at: new Date().toISOString() }); if (RECENT_ERR.length > 5) RECENT_ERR.shift(); };
window.addEventListener('error', e => noteErr((e.message || 'error') + (e.filename ? ` @${e.filename.split('/').pop()}:${e.lineno}` : '')));
window.addEventListener('unhandledrejection', e => noteErr('rejection: ' + ((e.reason && (e.reason.message || e.reason.code)) || e.reason)));
let repKind = 'bug';
function repOpen() {
  let d = $('#rdlg');
  if (!d) { d = document.createElement('dialog'); d.className = 'dlg'; d.id = 'rdlg'; d.setAttribute('aria-labelledby', 'rdlg-t'); document.body.appendChild(d); }
  repDraw(d, ''); d.showModal(); $('#rtx').focus();
}
function repDraw(d, sent) {
  const mine = Object.entries(Store.all('reports')).sort((a, b) => (b[1].at || '').localeCompare(a[1].at || '')).slice(0, 5);
  const list = mine.length ? `<ul class="rep-list">${mine.map(([, r]) => `<li><span class="t">${esc(r.text)}</span><span class="s">${r.issue ? `<a href="${esc(r.issue)}" target="_blank" rel="noopener">Issue #${esc(r.issue.split('/').pop())}</a>` : r.status === 'filed' ? 'Filed' : r.status === 'declined' ? 'Not posted' : r.status === 'held' ? 'Held' : 'Waiting for your OK'}</span></li>`).join('')}</ul>` : '';
  d.innerHTML = `<h2 id="rdlg-t">Report a problem</h2>${sent ? `<p class="muted" style="margin:0 0 8px">${sent}</p>` : ''}
    <span class="seg rep-kind" role="group" aria-label="Kind of report">${[['bug', 'Something’s wrong'], ['idea', 'Idea']].map(([v, l]) => `<button data-k="${v}" aria-pressed="${repKind === v}">${l}</button>`).join('')}</span>
    <div class="flagbox"><label for="rtx">${repKind === 'bug' ? 'What went wrong?' : 'What would make the hub better?'}</label><textarea id="rtx" maxlength="4000" placeholder="${repKind === 'bug' ? 'What you did, what happened, what you expected' : 'Describe the idea'}"></textarea></div>
    <p class="muted rep-note">Claude will check with you in chat before posting this as an issue on the public ma-study GitHub repo. Leave out personal details.</p>
    <div class="qnav"><button class="btn out" id="rno">Close</button><button class="btn" id="rgo" aria-keyshortcuts="Control+Enter Meta+Enter">Send${sendHint()}</button></div>${list}`;
  sendOnModEnter($('#rtx'), () => $('#rgo').click());
  d.querySelectorAll('.rep-kind button').forEach(b => b.onclick = () => { const t = $('#rtx').value; repKind = b.dataset.k; repDraw(d, ''); $('#rtx').value = t; $('#rtx').focus(); });
  $('#rno').onclick = () => d.close();
  $('#rgo').onclick = () => {
    const text = $('#rtx').value.trim(); if (!text) { $('#rtx').focus(); return; }
    const q = typeof run !== 'undefined' && run && run.Q && run.Q[run.i];
    Store.add('reports', { kind: repKind, text, route: location.hash || '#/', qid: q ? q.id : null, build: BUILD, ua: navigator.userAgent.slice(0, 200), errors: RECENT_ERR.slice(), at: new Date().toISOString(), status: 'queued' });
    repDraw(d, 'Saved. Claude will ask you before posting it to GitHub.');
  };
}
document.addEventListener('click', e => { if (e.target.closest('#repb')) repOpen(); });
</script>
